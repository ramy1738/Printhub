# Codemagic CI/CD configuration for ImprimeDoc Android App
workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 21
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Prepare environment files
        script: |
          # Ensure .env exists for the secrets plugin
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          # Ensure gradlew has executable permissions
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - rtech.bgf@gmail.com
        notify:
          on_build_failure: true
          on_build_success: true
